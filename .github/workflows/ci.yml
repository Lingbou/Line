name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run test suite
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked

  macos:
    name: macOS (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run test suite
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked

  windows:
    name: Windows (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x86_64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run test suite
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test the binary
        shell: pwsh
        run: |
          ./target/release/line.exe --version
          ./target/release/line.exe --list

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check all targets with the MSRV
        run: cargo check --all-targets --locked

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

  package:
    name: Package Smoke Test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            deb_arch: amd64
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils dpkg-dev rpm musl-tools
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Build static release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Assert the binary is self-contained
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/line"
          if readelf -l "$BIN" | grep -q 'INTERP'; then
            echo "release binary carries a dynamic interpreter" >&2
            exit 1
          fi
          if readelf -d "$BIN" 2> /dev/null | grep -q 'NEEDED'; then
            echo "release binary depends on shared libraries" >&2
            readelf -d "$BIN" >&2
            exit 1
          fi

      - name: Smoke test the binary
        run: |
          BIN="target/${{ matrix.target }}/release/line"
          "$BIN" --version

      - name: Build and inspect packages
        run: |
          set -euo pipefail
          rm -rf package-smoke
          mkdir -p package-smoke
          cargo deb --no-build --target ${{ matrix.target }} -o package-smoke
          cargo generate-rpm --target ${{ matrix.target }} -o package-smoke

          DEB="$(find package-smoke -maxdepth 1 -name '*.deb' -print -quit)"
          RPM="$(find package-smoke -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$DEB"
          test -n "$RPM"

          # Package metadata must describe the architecture we actually built.
          test "$(dpkg-deb -f "$DEB" Architecture)" = "${{ matrix.deb_arch }}"
          test "$(rpm -qp --queryformat '%{ARCH}' "$RPM")" = "${{ matrix.rpm_arch }}"

          dpkg-deb -f "$DEB" Depends | grep -q 'openssh-client'
          rpm -qpR "$RPM" | grep -q '^openssh-clients$'
          if dpkg-deb -f "$DEB" Depends | grep -q 'libc6'; then
            echo "static package unexpectedly depends on glibc" >&2
            exit 1
          fi
          if rpm -qpR "$RPM" | grep -q 'GLIBC_'; then
            echo "static package unexpectedly depends on a GLIBC symbol version" >&2
            exit 1
          fi

      - name: Package tarball (.tar.gz)
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "line") | .version')"
          bash packaging/make-tarball.sh "$VERSION" "${{ matrix.target }}" package-smoke

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.target }}
          path: package-smoke/*
          if-no-files-found: error

  package-install:
    name: Package install (${{ matrix.image }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:bookworm-slim
            family: deb
          - image: ubuntu:24.04
            family: deb
          - image: fedora:latest
            family: rpm
          - image: rockylinux:9
            family: rpm
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download the ARM64 packages
        uses: actions/download-artifact@v8
        with:
          name: packages-aarch64-unknown-linux-musl
          path: pkg

      - name: Install and run the package in ${{ matrix.image }}
        run: |
          set -euo pipefail
          case "${{ matrix.family }}" in
            deb) package="$(find pkg -maxdepth 1 -name '*.deb' -print -quit)" ;;
            rpm) package="$(find pkg -maxdepth 1 -name '*.rpm' -print -quit)" ;;
          esac
          test -n "$package"
          package_path="/tmp/$(basename "$package")"
          docker run --rm \
            -v "$PWD/$package:$package_path:ro" \
            -v "$PWD/packaging/smoke:/tmp/smoke:ro" \
            "${{ matrix.image }}" \
            sh "/tmp/smoke/install-${{ matrix.family }}.sh" "$package_path"

  static-distro-install:
    name: Static tarball on ${{ matrix.image }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        image:
          - alpine:latest
          - archlinux:latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download the static tarball
        uses: actions/download-artifact@v8
        with:
          name: packages-x86_64-unknown-linux-musl
          path: pkg

      - name: Install and run the tarball in ${{ matrix.image }}
        run: |
          set -euo pipefail
          tarball="$(find pkg -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$tarball"
          tarball_path="/tmp/$(basename "$tarball")"
          docker run --rm \
            -v "$PWD/$tarball:$tarball_path:ro" \
            -v "$PWD/packaging/smoke:/tmp/smoke:ro" \
            "${{ matrix.image }}" \
            sh /tmp/smoke/install-tarball.sh "$tarball_path"
