name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run test suite
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check all targets with the MSRV
        run: cargo check --all-targets --locked

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

  package:
    name: Package Smoke Test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            deb_arch: amd64
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm musl-tools
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Build static release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test the binary
        run: |
          BIN="target/${{ matrix.target }}/release/line"
          "$BIN" --version

      - name: Build and inspect packages
        run: |
          set -euo pipefail
          rm -rf package-smoke
          mkdir -p package-smoke
          cargo deb --no-build --target ${{ matrix.target }} -o package-smoke
          cargo generate-rpm --target ${{ matrix.target }} -o package-smoke

          DEB="$(find package-smoke -maxdepth 1 -name '*.deb' -print -quit)"
          RPM="$(find package-smoke -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$DEB"
          test -n "$RPM"

          # Package metadata must describe the architecture we actually built.
          test "$(dpkg-deb -f "$DEB" Architecture)" = "${{ matrix.deb_arch }}"
          test "$(rpm -qp --queryformat '%{ARCH}' "$RPM")" = "${{ matrix.rpm_arch }}"

          dpkg-deb -f "$DEB" Depends | grep -q 'openssh-client'
          rpm -qpR "$RPM" | grep -q '^openssh-clients$'
          if dpkg-deb -f "$DEB" Depends | grep -q 'libc6'; then
            echo "static package unexpectedly depends on glibc" >&2
            exit 1
          fi
          if rpm -qpR "$RPM" | grep -q 'GLIBC_'; then
            echo "static package unexpectedly depends on a GLIBC symbol version" >&2
            exit 1
          fi

      - name: Install the Debian package and run it
        run: |
          set -euo pipefail
          DEB="$(find package-smoke -maxdepth 1 -name '*.deb' -print -quit)"
          sudo dpkg -i "$DEB"
          line --version
          sudo dpkg -r line

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: package-smoke/*
          if-no-files-found: error

  deb-install:
    name: Debian/Ubuntu ARM64 install (${{ matrix.image }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:bookworm-slim
          - ubuntu:24.04
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download the ARM64 Debian package
        uses: actions/download-artifact@v4
        with:
          name: packages-aarch64-unknown-linux-musl
          path: pkg

      - name: Write the in-container install script
        run: |
          cat > install-smoke.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends /tmp/line.deb > /dev/null

          # The declared dependency must have pulled in the OpenSSH client.
          dpkg -s openssh-client > /dev/null

          # The static build must not depend on the image glibc.
          LDD_OUTPUT="$(ldd /usr/bin/line 2>&1 || true)"
          if ! printf '%s\n' "$LDD_OUTPUT" | grep -Eq 'statically linked|not a dynamic executable'; then
            echo "ARM64 package unexpectedly links against the system libc" >&2
            printf '%s\n' "$LDD_OUTPUT" >&2
            exit 1
          fi

          line --version | grep -Eq '^line [0-9]+\.[0-9]+\.[0-9]+'
          SCRIPT
          cat install-smoke.sh

      - name: Install and run the package in ${{ matrix.image }}
        run: |
          set -euo pipefail
          DEB="$(find pkg -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          docker run --rm \
            -v "$PWD/${DEB}:/tmp/line.deb:ro" \
            -v "$PWD/install-smoke.sh:/tmp/install-smoke.sh:ro" \
            "${{ matrix.image }}" \
            bash /tmp/install-smoke.sh
