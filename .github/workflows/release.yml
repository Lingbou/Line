name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Extract version tag
        id: vars
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "line") | .version')"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "tag version $VERSION does not match Cargo.toml version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run release checks
        run: |
          cargo test --all-targets --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build static release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package Debian (.deb)
        run: |
          mkdir -p dist
          cargo deb --no-build --target x86_64-unknown-linux-musl -o dist

      - name: Package RPM (.rpm)
        run: |
          mkdir -p dist
          cargo generate-rpm --target x86_64-unknown-linux-musl -o dist

      - name: Package Tarballs (.tar.gz)
        run: |
          TAG="${{ steps.vars.outputs.tag }}"

          # Static musl build (compatible across all Linux distros)
          mkdir -p "dist/line-${TAG}-x86_64-unknown-linux-musl"
          cp target/x86_64-unknown-linux-musl/release/line "dist/line-${TAG}-x86_64-unknown-linux-musl/"
          cp README.md LICENSE "dist/line-${TAG}-x86_64-unknown-linux-musl/"
          tar -czf "dist/line-${TAG}-x86_64-unknown-linux-musl.tar.gz" -C dist "line-${TAG}-x86_64-unknown-linux-musl"
          rm -rf "dist/line-${TAG}-x86_64-unknown-linux-musl"

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum * > "line-${{ steps.vars.outputs.tag }}-checksums.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
