name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  checks:
    name: Release Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Extract version tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "line") | .version')"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "tag version $VERSION does not match Cargo.toml version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Run release checks
        run: |
          cargo test --all-targets --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings

  build:
    name: Build ${{ matrix.target }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            deb_arch: amd64
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools rpm
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Build static release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test the binary
        run: |
          BIN="target/${{ matrix.target }}/release/line"
          "$BIN" --version
          "$BIN" --help > /dev/null

      - name: Package Debian (.deb)
        run: |
          mkdir -p dist
          cargo deb --no-build --target ${{ matrix.target }} -o dist
          DEB="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "${{ matrix.deb_arch }}"

      - name: Package RPM (.rpm)
        run: |
          mkdir -p dist
          cargo generate-rpm --target ${{ matrix.target }} -o dist
          RPM="$(find dist -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$RPM"
          test "$(rpm -qp --queryformat '%{ARCH}' "$RPM")" = "${{ matrix.rpm_arch }}"

      - name: Package Tarball (.tar.gz)
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          bash packaging/make-tarball.sh "${TAG#v}" "${{ matrix.target }}" dist

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum -- * > "line-${GITHUB_REF#refs/tags/}-checksums.txt"
          cat "line-${GITHUB_REF#refs/tags/}-checksums.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
