[package]
name = "line"
version = "0.1.0"
edition = "2024"
description = "A lightweight terminal SSH connection manager"
license = "GPL-3.0-only"

[dependencies]
base64 = "0.22"
crossterm = "0.28"
fs2 = "0.4"
libc = "0.2"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
thiserror = "2"
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
